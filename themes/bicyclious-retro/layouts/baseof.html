<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.subtitle }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Site.Params.ogImage }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;0,7..72,900;1,7..72,400&display=swap" rel="stylesheet">
  <!-- Swiper -->
  <link rel="stylesheet" href="{{ "css/swiper.min.css" | relURL }}">
  <!-- CSS -->
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="site-header">
    <div class="site-masthead">
      <a href="{{ "/" | relURL }}" class="site-logo">
        {{ if .Site.Params.logo }}
          <img src="{{ .Site.Params.logo }}" alt="{{ .Site.Title }}" class="logo-img">
        {{ else }}
          <span class="logo-bracket">[</span><span class="logo-text">BICYCLIOUS</span><span class="logo-bracket">]</span>
        {{ end }}
      </a>
    </div>
    <div class="site-nav-bar">
      <div class="nav-inner">
        <p class="site-tagline">{{ .Site.Params.subtitle }}</p>
        <nav class="site-nav" aria-label="Main navigation">
          {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}"
             class="{{ if eq $.RelPermalink .URL }}nav-active{{ end }}">
            {{ .Name }}
          </a>
          {{ end }}
        </nav>
      </div>
    </div>
  </header>

  <main class="site-main" id="main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">BICYCLIOUS</span>
      <span class="footer-copy">© {{ now.Year }}</span>
    </div>
  </footer>
  <script src="{{ "js/swiper.min.js" | relURL }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var swiper = new Swiper('.bike-carousel', {
        slidesPerView: 1.2,
        centeredSlides: true,
        spaceBetween: 16,
        loop: true,
        grabCursor: true,
        autoplay: { delay: 2500, disableOnInteraction: false, pauseOnMouseEnter: true },
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        keyboard: {
          enabled: true,
          onlyInViewport: true,
        },
        breakpoints: {
          640:  { slidesPerView: 1.2, spaceBetween: 20 },
          1024: { slidesPerView: 1.2, spaceBetween: 24 }
        }
      });

      swiper.on('click', function () {
        var slide = swiper.slides[swiper.clickedIndex];
        if (slide) {
          var href = slide.getAttribute('data-href');
          if (href) window.location.href = href;
        }
      });
    });
  </script>
</body>
</html>
